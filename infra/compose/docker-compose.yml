services:
  postgres:
    image: postgres:16-alpine
    container_name: trust-trash-postgres
    environment:
      POSTGRES_DB: trust_trash
      POSTGRES_USER: trust_trash
      POSTGRES_PASSWORD: trust_trash_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trust_trash -d trust_trash"]
      interval: 5s
      timeout: 3s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2
    container_name: trust-trash-opensearch
    profiles: ["search"]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  redis:
    image: redis:7-alpine
    container_name: trust-trash-redis
    profiles: ["workers"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  opensearch_data:
  redis_data:
